<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">{{if .OK}}<meta http-equiv="refresh" content="2;url={{.ContinueURL}}">{{end}}<title>{{.Title}} — Metatrash</title><script src="{{.BasePath}}/assets/theme.js"></script><link rel="stylesheet" href="{{.BasePath}}/assets/signin.css"></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="auth-page">
<a class="auth-brand" href="{{.BasePath}}/">metatrash<span>.</span></a>
<main id="main" class="auth-card">
<div class="auth-head"><p class="section-label">{{.Eyebrow}}</p><h1>{{.Title}}</h1></div>
<p{{if not .OK}} class="problem" role="alert"{{else}} class="note" role="status"{{end}}>{{.Message}}</p>
<a class="btn primary block" href="{{.ContinueURL}}">{{.Button}}</a>
</main>
<footer class="auth-footer"><a href="{{.BasePath}}/spaces/#settings">Settings</a><a href="{{.BasePath}}/">Home</a><a href="{{.BasePath}}{{if .Legal}}/docs/about.md{{else}}/about{{end}}">About</a>{{if .Legal}}<a href="{{.BasePath}}/docs/legal/privacy.md">Privacy</a><a href="{{.BasePath}}/docs/legal/terms.md">Terms</a><a href="{{.BasePath}}/docs/legal/refunds.md">Refunds</a>{{end}}</footer>
</div>
</body></html>
